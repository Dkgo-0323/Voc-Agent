# pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voc-agent"
version = "0.1.0"
description = "VOC Agent — 户外电源竞品舆情分析系统"
requires-python = ">=3.11"

dependencies = [
    # ── Web 框架 ──────────────────────────────────────────────
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    # ── 数据库（异步）────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    # ── 配置管理 ─────────────────────────────────────────────
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    # ── 向量数据库 ───────────────────────────────────────────
    # Keep the client protocol-compatible with docker-compose Milvus v2.3.4.
    "pymilvus>=2.3.6,<2.4.0",
    # PyMilvus 2.3 imports the legacy pkg_resources module at runtime.
    "setuptools<81",
    # PyMilvus 2.3's environs integration requires Marshmallow 3.x.
    "marshmallow>=3.13,<4",
    # ── 数据抓取 ─────────────────────────────────────────────
    "praw>=7.7.1",               # Reddit API
    # ── PII 脱敏 ─────────────────────────────────────────────
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",
    "spacy>=3.7.4",              # Presidio NLP backend
    # ── 调度 ─────────────────────────────────────────────────
    "apscheduler>=3.10.4",
    # ── 鉴权 ─────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # ── HTTP 客户端 ──────────────────────────────────────────
    "httpx>=0.27.0",
    # ── OpenAI SDK ───────────────────────────────────────────
    "openai>=1.30.0",
    "langdetect>=1.0.9",
    # ── 工具 ─────────────────────────────────────────────────
    "tenacity>=8.3.0",           # 重试装饰器
    "rich>=13.7.1",              # 日志美化（CLI工具用）
    "python-multipart>=0.0.9",   # FastAPI 表单支持
    "ijson>=3.5.0",
    "datasets>=5.0.0",
    "huggingface-hub>=1.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",             # TestClient
    "ruff>=0.4.5",               # Linter + Formatter
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

# ── uv 配置 ──────────────────────────────────────────────────
[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.5",
    "mypy>=1.10.0",
]

# ── Ruff（Lint + Format）─────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # 行长由 formatter 管

[tool.ruff.lint.isort]
known-first-party = ["backend"]

# ── Pytest ───────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
# Disable the cache plugin because a sandbox-created repository cache can be
# inaccessible to a normal Windows developer account. ``conftest.py`` assigns
# each run a unique checkout-local base temp directory for the same reason.
addopts = "-p no:cacheprovider"

# ── MyPy ─────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
